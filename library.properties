sentence=ESP32 BLE HID combo library for keyboard, mouse, or both using NimBLE-Arduino. Fork with JIS (Japanese) keyboard layout support (class renamed to ESP32BLEComboJIS to avoid conflicts with the original library).
paragraph=Fork of kokodev's ESP32BLECombo. All classes/files are renamed with a "JIS" suffix so this library can be installed alongside the original ESP32BLECombo without name conflicts. Adds JISKeyboardHelper for correct symbol input on JIS (Japanese) keyboard layouts.
category=Communication
